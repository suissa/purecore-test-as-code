intent: ConfiguredDynamicDataIntent
valid_fixtures: fixture.observed-record-batch.alpha,fixture.observed-record-batch.beta,fixture.observed-record-batch.gamma,fixture.observed-record-batch.delta,fixture.observed-record-batch.epsilon
