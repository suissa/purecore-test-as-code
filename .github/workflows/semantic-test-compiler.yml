name: Semantic Test Compiler

on:
  push:
    paths:
      - "build.zig"
      - "src/**"
      - "README.md"
      - ".github/workflows/semantic-test-compiler.yml"
  pull_request:
    paths:
      - "build.zig"
      - "src/**"
      - "README.md"
      - ".github/workflows/semantic-test-compiler.yml"

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt build.zig src
      - name: Patch validation
        run: git diff --check
      - name: Compiler tests
        run: zig build test
      - name: Generate canonical JSON
        run: zig build run 2> generated-tests.json
      - name: Validate generated JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path("generated-tests.json").read_text())
          assert document["schema"] == "test.bundle.v1"
          entries = document["tests"]
          dynamic = [entry for entry in entries if entry["kind"] == "dynamic-contract"]
          benchmarks = [entry for entry in entries if entry["kind"] == "benchmark"]
          assert len(dynamic) == len(benchmarks) == 2
          assert {entry["schema"] for entry in dynamic} == {"test.dynamic.v1"}
          assert {entry["schema"] for entry in benchmarks} == {"test.benchmark.v1"}
          for entry in dynamic:
              assert len(entry["valid_cases"]) == 5
              assert entry["invalid_case_count"] == 48
              assert len(entry["invalid_cases"]) == 48
              assert all(case["expected"] == "accept" for case in entry["valid_cases"])
              assert all(case["expected"] == "reject" for case in entry["invalid_cases"])
          assert {entry["schema"] for entry in entries} == {
              "test.dynamic.v1",
              "test.load.v1",
              "test.stress.v1",
              "test.chaos.v1",
              "test.security.v1",
              "test.benchmark.v1",
          }
          assert all(entry["kind"] != "unit" for entry in entries)
          PY
      - name: Upload generated contract
        uses: actions/upload-artifact@v4
        with:
          name: canonical-test-json
          path: generated-tests.json
